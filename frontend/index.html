<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Botanical Intelligence classifies Iris flowers from sepal and petal measurements."
    />
    <meta name="theme-color" content="#F7F5ED" />
    <title>Iris Flower Classification</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@360;480;560;640&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const stored = localStorage.getItem("iris-theme");
        const theme =
          stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content",
          theme === "dark" ? "#141C19" : "#F7F5ED",
        );
      } catch (error) {
        /* Theme selection is optional before React loads. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
